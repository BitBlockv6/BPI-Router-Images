# ============================================================
# hostapd - wlan1.conf
# BPI-R3 (MT7975P) | 5 GHz | WiFi 6 (802.11ax)
# Debian 13 | Kernel 6.1+ | Country: NZ
# ============================================================

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

interface=wlan1
driver=nl80211

# --- Regulatory & RF ---
country_code=NZ
ieee80211d=1
ieee80211h=1
# ieee80211h=1 ist Pflicht für DFS-Kanäle (ETSI/NZ) - radar detection

# 5 GHz: hw_mode=a
hw_mode=a

# Kanal 36 (5.180 GHz, UNII-1, kein DFS, sofort verfügbar)
# Bei 160 MHz: Center-Freq idx=50 → Kanäle 36-64 werden genutzt
channel=36
noscan=1

# Maximale TX-Power (NZ/5GHz UNII-1: bis zu 30 dBm EIRP)
txpower=30

# --- 802.11n (HT) ---
ieee80211n=1
ht_capab=[LDPC][HT40+][HT40-][GF][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1][MAX-AMSDU-7935][DSSS_CCK-40]

# --- 802.11ac (VHT) ---
ieee80211ac=1
# VHT160: Kanalbreite 160 MHz aktivieren
# Wenn 160 MHz Probleme macht (Treiber/Regulatory), auf vht_oper_chwidth=1 (80 MHz) zurückfallen
vht_oper_chwidth=2
vht_oper_centr_freq_seg0_idx=50
# idx=50 = Center bei 5.250 GHz → deckt CH 36-64 ab (160 MHz)

vht_capab=[MAX-MPDU-11454][RXLDPC][SHORT-GI-80][SHORT-GI-160][VHT160][TX-STBC-2BY1][RX-STBC-1][SU-BEAMFORMER][SU-BEAMFORMEE][BF-ANTENNA-3][MU-BEAMFORMER][SOUNDING-DIMENSION-3][RX-ANTENNA-PATTERN][TX-ANTENNA-PATTERN][MAX-A-MPDU-LEN-EXP3]
# SU-BEAMFORMER/BEAMFORMEE = Single-User Beamforming
# MU-BEAMFORMER            = Multi-User Beamforming (AP-seitig)
# BF-ANTENNA-3             = 4 Antennen (0-indexed: 3 = 4 Antennen)
# SOUNDING-DIMENSION-3     = 4 Sounding-Dimensionen für MU-MIMO
# VHT160                   = 160 MHz VHT-Modus
# MAX-MPDU-11454           = maximale MPDU-Größe (802.11ac Max)

# --- 802.11ax (HE / WiFi 6) ---
ieee80211ax=1
he_oper_chwidth=2
# 2 = 160 MHz im 5 GHz Band
he_oper_centr_freq_seg0_idx=50

# HE Beamforming
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1

# BSS Color (reduziert Interferenzen, WiFi 6 Feature)
he_bss_color=42
he_bss_color_disabled=0

# OFDMA + MU-MIMO (WiFi 6 Kernfeatures)
# Werden automatisch aktiviert wenn ieee80211ax=1 und HE-fähige Clients vorhanden

# --- WMM / QoS (Pflicht für 802.11n/ac/ax) ---
wmm_enabled=1
uapsd_advertisement_enabled=1

# Optimierte WMM-Queues für Low-Latency
wmm_ac_vo_cwmin=2
wmm_ac_vo_cwmax=3
wmm_ac_vo_aifs=2
wmm_ac_vo_txop_limit=47
wmm_ac_vi_cwmin=3
wmm_ac_vi_cwmax=4
wmm_ac_vi_aifs=2
wmm_ac_vi_txop_limit=94
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=10
wmm_ac_be_aifs=3
wmm_ac_be_txop_limit=0
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_aifs=7
wmm_ac_bk_txop_limit=0

# --- SSID ---
ssid=bPi-R3_5
ignore_broadcast_ssid=0

# --- Sicherheit: WPA2/WPA3 SAE Transition Mode ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256 SAE
# WPA-PSK        = WPA2 Legacy-Clients
# WPA-PSK-SHA256 = WPA2 mit SHA256 (stärker, kompatibel)
# SAE            = WPA3-Personal

wpa_passphrase=changeme123
sae_password=changeme123

# MFP: 1 = optional (Transition), 2 = required (nur WPA3)
ieee80211w=1
sae_require_mfp=1
sae_pwe=2
# sae_pwe=2 = H2E (Hash-to-Element), moderner SAE-Handshake

# Cipher Suites
wpa_pairwise=CCMP
rsn_pairwise=CCMP CCMP-256

# --- Performance & Stabilität ---
beacon_int=100
dtim_period=2
max_num_sta=128
rts_threshold=2347
fragm_threshold=2346
preamble=1

# Multiband Operation (MBO) - hilft Clients beim Bandwechsel
mbo=1
rnr=1
# rnr=1 = Reduced Neighbor Report (für 802.11v/k Roaming)