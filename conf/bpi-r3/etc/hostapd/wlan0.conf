# ============================================================
# hostapd - wlan0.conf
# BPI-R3 (MT7975N) | 2.4 GHz | WiFi 6 (802.11ax)
# Debian 13 | Kernel 6.1+ | Country: NZ
# ============================================================

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

interface=wlan0
driver=nl80211

# --- Regulatory & RF ---
country_code=NZ
ieee80211d=1
ieee80211h=0

# 2.4 GHz 802.11b/g/n/ax
hw_mode=g

# Kanal 1 mit sekundĂ¤rem Kanal oberhalb (-> effektiv CH 1+5 = 40 MHz)
channel=1
noscan=1

# Maximale TX-Power (in dBm * 100; 0 = Regulatory-Maximum des Landes)
# NZ erlaubt 30 dBm EIRP auf 2.4 GHz
txpower=30

# --- 802.11n (HT) ---
ieee80211n=1
ht_capab=[HT40+][LDPC][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1][MAX-AMSDU-7935][DSSS_CCK-40]
# HT40+ = SekundĂ¤rkanal Ăźber Kanal 1 (Kanal 5 als Extension)
# LDPC = Low-Density Parity-Check (bessere Fehlerkorrektur)
# TX-STBC + RX-STBC1 = Spatial Multiplexing / Beamforming-Vorstufe
# MAX-AMSDU-7935 = maximale Frame-Aggregation

# --- 802.11ax (HE / WiFi 6) ---
ieee80211ax=1
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_oper_chwidth=0
# 0 = 20/40 MHz im 2.4 GHz Band (korrekt, kein 80 MHz in 2.4 GHz)
he_oper_centr_freq_seg0_idx=3
# Segment-Center: CH1 + 20 MHz offset = Index 3 (bei HT40+, CH1)

# --- WMM / QoS ---
wmm_enabled=1
uapsd_advertisement_enabled=1

# --- SSID ---
ssid=bPi-R3_24
ignore_broadcast_ssid=0

# --- Sicherheit: WPA2/WPA3 SAE Transition Mode ---
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK SAE
# WPA-PSK = WPA2 fĂźr Legacy-Clients
# SAE    = WPA3-Personal fĂźr moderne Clients

wpa_passphrase=changeme123

# Hinweis: Passphrase >63 Zeichen -> muss als PSK-Hash angegeben werden!
# Erstelle den Hash mit: wpa_passphrase r3_AP0
# und trage den hex-PSK unter wpa_psk= ein (oder nutze sae_password)

sae_password=changeme123

# SAE unterstĂźtzt beliebige PasswortlĂ¤ngen direkt

# MFP (Management Frame Protection)
# 1 = optional (WPA2/WPA3 Transition), 2 = required (nur WPA3)
ieee80211w=1
sae_require_mfp=1

# Cipher Suites
wpa_pairwise=CCMP
rsn_pairwise=CCMP
# TKIP entfernt (unsicher, inkompatibel mit 802.11n HT-Modus)

# --- Weitere Stabilitaets-Parameter ---
beacon_int=100
dtim_period=2
max_num_sta=64
rts_threshold=2347
fragm_threshold=2346